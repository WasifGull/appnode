name: Deploy Node.js app to EC2

on:
  push:
    branches:
      - main  # You can change 'main' to your default branch, e.g., 'master'

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
    # Checkout the code from the repository
    - name: Checkout code
      uses: actions/checkout@v2

    # Set up Node.js
    - name: Set up Node.js
      uses: actions/setup-node@v2
      with:
        node-version: '14'  # You can specify the version you use (e.g., '16')

    # Install dependencies
    - name: Install dependencies
      run: npm install

    # Run tests (optional)
    - name: Run tests
      run: npm test  # You can skip this if you don’t have tests yet

    # Deploy to EC2
    - name: Deploy to EC2
      run: |
        echo "Deploying to EC2"
        ssh -o StrictHostKeyChecking=no -i ${{ secrets.EC2_SSH_KEY }} ubuntu@${{ secrets.EC2_PUBLIC_IP }} << 'EOF'
          cd /path/to/your/app
          git pull origin main  # or the branch you're deploying from
          npm install
          pm2 restart app  # Or if you're using a different process manager, adjust accordingly
        EOF
      env:
        EC2_PUBLIC_IP: ${{ secrets.EC2_PUBLIC_IP }}
        EC2_SSH_KEY: ${{ secrets.EC2_SSH_KEY }}
