name: Deploy Node.js app to EC2

on:
  push:
    branches:
      - main  # Adjust according to your default branch

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
    # Checkout the code from the repository
    - name: Checkout code
      uses: actions/checkout@v2

    # Set up Node.js
    - name: Set up Node.js
      uses: actions/setup-node@v2
      with:
        node-version: '14'

    # Install dependencies
    - name: Install dependencies
      run: npm install

    # Run tests (optional)
    - name: Run tests
      run: npm test  # Skip this if no tests are present

    # Deploy to EC2
    - name: Deploy to EC2
      run: |
        echo "Deploying to EC2"
        mkdir -p ~/.ssh
        echo "${{ secrets.EC2_SSH_KEY }}" > ~/.ssh/id_rsa
        chmod 600 ~/.ssh/id_rsa
        ssh -o StrictHostKeyChecking=no -i ~/.ssh/id_rsa ubuntu@${{ secrets.EC2_PUBLIC_IP }} << 'EOF'
          cd /path/to/your/app
          git pull origin main  # Replace 'main' with your branch
          npm install
          pm2 restart app  # Or your own process manager/command
        EOF
      env:
        EC2_PUBLIC_IP: ${{ secrets.EC2_PUBLIC_IP }}
        EC2_SSH_KEY: ${{ secrets.EC2_SSH_KEY }}
